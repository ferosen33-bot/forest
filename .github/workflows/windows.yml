# Baut Wildwood als Windows-Programm (Installer + portable .exe) und stellt es unter
# „Releases → Wildwood (aktueller Stand)“ zum Herunterladen bereit.
name: Windows-Spiel bauen

on:
  push:
    branches: [main, ccr-4c965261-ybll9f]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Wildwood-Windows
          path: release/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: spiel-aktuell
          name: Wildwood (aktueller Stand)
          make_latest: true
          files: release/*.exe
          body: |
            **Wildwood** – Survival-Horror auf einer Insel.

            - **Wildwood-Setup-….exe**: installiert das Spiel (Desktop- und Startmenü-Verknüpfung).
            - **Wildwood-…-portable.exe**: ohne Installation, einfach doppelklicken.

            Windows warnt beim ersten Start („Der Computer wurde durch Windows geschützt“), weil das Programm
            nicht signiert ist: **Weitere Informationen → Trotzdem ausführen**.
